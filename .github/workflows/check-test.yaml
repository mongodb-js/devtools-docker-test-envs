name: Check and Test

on:
  pull_request:
  workflow_dispatch:

jobs:
  check-and-test:
    name: Check and Test
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/jod
      - run: npm ci
      - run: npm run check
      - run: npm test
