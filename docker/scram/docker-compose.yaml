version: '3'

services:
  mongodb:
    image: 'mongo:${MONGODB_VERSION:-8.2}'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: admin
    ports:
      - '28006:27017'
    volumes:
      - './initdb:/docker-entrypoint-initdb.d/:ro'
